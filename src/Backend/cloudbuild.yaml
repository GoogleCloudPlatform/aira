steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/app-stt/backend:latest",
        ".",
      ]

  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/app-stt/backend:latest"]

  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "backend",
        "--project=$PROJECT_ID",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/app-stt/backend:latest",
        "--region",
        "us-central1",
        "--memory",
        "8Gi",
        "--cpu",
        "2",
        "--service-account",
        "sa-$PROJECT_NUMBER-back-engine@$PROJECT_ID.iam.gserviceaccount.com",
        "--remove-secrets=LOOKERSDK_BASE_URL,LOOKERSDK_CLIENT_ID,LOOKERSDK_CLIENT_SECRET",
        "--update-secrets=_BUCKET_PATH=bucket_name:latest,_DATABASE_URI=sql_connection_url:latest,_PUBSUB_TOPIC=processor_queue:latest,_BQ_DATASET=dataset_name:latest,_BQ_TABLE_NAME=table_name:latest,_PUBSUB_CONVERT_TOPIC=conversion_queue:latest,_ORIGIN=front_url:latest,_LOOKER_SECRET=looker_secret:latest,/secrets/api/gcs_sa_key=gcs_sa_key:latest,_SENDGRID_KEY=sendgrid_api_key:latest",
        "--set-env-vars=_GCP_STORAGE_CREDENTIALS=/secrets/api/gcs_sa_key,_MODEL_VERSION=gemini-2.5-flash,_PROJECT_ID=$PROJECT_ID,_ENV=prd,_LOOKER_HOST=update_value.cloud.looker.com,_LOOKER_ALLOWED_DASHBOARD_IDS=1,2,_FRONT_BASE_URL=https://frontend-1035050987841.us-central1.run.app,_FORGOT_PW_TEMPLATE=update-here,_SENDER_EMAIL=update-here@domain.com,_KB_BUCKET_PATH=$PROJECT_ID-aira-kb-files,_KB_PROCESSING_TOPIC=kb_processing_topic,_PUBSUB_SERVICE_ACCOUNT_EMAIL=sa-$PROJECT_NUMBER-pubsub-push@$PROJECT_ID.iam.gserviceaccount.com,_PUBSUB_AUDIENCE=https://update-backend-url.run.app",
        # TODO(security): Browser clients currently call the backend directly.
        # Consider fronting the API with Cloud Load Balancing + --ingress=internal-and-cloud-load-balancing
        # (or splitting internal Pub/Sub workers onto a separate --no-allow-unauthenticated Cloud Run service).
        "--allow-unauthenticated",
        "--vpc-connector=vpc-con",
        "--set-cloudsql-instances=$PROJECT_ID:us-central1:$PROJECT_ID-sql-instance",
      ]
images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/app-stt/backend:latest"
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/sa-${PROJECT_NUMBER}-cloudbuild@${PROJECT_ID}.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY