[project]
name = "aira-agent"
version = "0.1.0"
description = "Educational agent for reading proficiency"
authors = [
    {name = "Fabrício Sanchez",email = "fabricio.sanchez@gmail.com"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk (>=2.5.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "google-cloud-bigquery (>=3.42.2,<4.0.0)",
    "google-cloud-aiplatform (>=1.162.0,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-http (<=1.42.1)",
    "cloud-sql-python-connector (>=1.20.4,<2.0.0)",
    "chromadb (>=0.6.3,<0.7.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.2.0,<9.0.0)",
    "pytest-asyncio (>=0.23.6,<0.24.0)"
]

